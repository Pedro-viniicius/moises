<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Entrar · Moisés</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="login">
    <div class="login-cartao">
      <div class="login-cab">
        <span class="marca marca-grande" aria-hidden="true">M</span>
        <h1>Moisés</h1>
        <p class="login-sub">Suas sessões do Claude Code</p>
      </div>
      <form id="form" method="post" action="/api/login" novalidate>
        <label for="senha">Senha</label>
        <input class="campo" id="senha" type="password" autocomplete="current-password" required autofocus>
        <button class="btn btn-primario" id="entrar" type="submit">Entrar</button>
        <p class="erro" id="erro" role="alert" hidden></p>
      </form>
    </div>
  </main>
  <script src="/login.js"></script>
</body>
</html>
